<!DOCTYPE html>
<html lang="en">
  <head> 
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, intial-scale=1.0">
       <title>Chaos Realm Forge</title>

       <style>
           body{ 
               margin:0;
               background: linear-gradient(
                   180deg,
                   #08111f 0%,
                   #101b3d 50%,
                   #1a1035 100%
               );
               color: white;
               font-family: Arial, Helvetica, sans-serif;
               text-align: center;
       }
       .hero {
           min-height: 100vh;
           padding: 120px 20px;
           box-sizing: border-box;
       }
       hl {
           font-size: 60px;
           margin-bottom: 10px;
           color: white;
           text-shadow:
               0 0 10px #3b82f6,
               0 0 20px #8b5cf6,
               0 0 35px #8b5cf6;
       }
       h2 {
           color: #a78bfa;
           font-weight: normal;
           margin-bottom: 40px;
       }
       p {
           max-width: 700px;
           margin-left: auto;
           margin-right: auto;
           font-size: 22px;
           line-height: 1.6;
           color: #e2e8f0;
       }
       .button {
           display: inline-block;
           margin-top: 50px;
           padding: 15px 35px;
           background: linear-gradient(
               90deg,  
               #2563eb,
               #7c3aed
           );
           color: white;
           text-decoration: none;
           border-radius: 10px;
           font-size: 20px;
           box-shadow:
               0 0 18px rgba(37, 99, 235,
0.6),
               0 0 28px rgba(124, 58,
237, 0.45);
       }
       .button:hover {
           background: linear-gradient(
               90deg,
               #3b82f6,
               #8b5cf6
           );
       }
   </style>
</head>
<body>
      <section class="hero">
          <h1>CHAOS REALM FORGE</h1>
          <h2>Forging Worlds. Shaping
Legends.</h2>
        <p>
            Welcome to Chaos Realm Forge,
an independent game 
            development studio
            dedicated to creating
immersive worlds where every decision
matters.
        </p>
        <p style="margin-top: 40px;">
            Our first title,
<strong>AscensionFall</strong>,
            is currently in development.
        </p>
        <a class="button" href="#">Coming
Soon</a>
    </section>
</body>
</html>
